services:
  postgres:
    image: postgres:16
    container_name: gayang-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-gayang}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-gayang}
      POSTGRES_DB: ${PG_DB:-gayang}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-gayang} -d ${PG_DB:-gayang}"]
      interval: 5s
      timeout: 5s
      retries: 10

  memgraph:
    image: memgraph/memgraph:2.18.0
    container_name: gayang-memgraph
    ports:
      - "${MG_PORT:-7687}:7687"
      - "7444:7444"
    volumes:
      - mgdata:/var/lib/memgraph
    command: ["--log-level=INFO"]

  memgraph-lab:
    image: memgraph/lab
    profiles: ["lab"]
    ports:
      - "3000:3000"

volumes:
  pgdata:
  mgdata:
